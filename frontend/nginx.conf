# Docker's embedded DNS refreshes the backend address after container replacement.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream rolebridge_backend {
    zone rolebridge_backend 64k;
    server backend:5001 resolve;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # React HTML entry point
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache versioned Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Express backend API
    location /api/ {
        proxy_pass http://rolebridge_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # React Router fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
